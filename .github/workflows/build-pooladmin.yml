name: Build PoolAdmin (iOS arm64)

on:
  workflow_dispatch:
  push:
    paths:
      - "PoolAdmin/**"
      - ".github/workflows/build-pooladmin.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version; xcrun --sdk iphoneos --show-sdk-path

      - name: Build libPoolAdmin.dylib
        run: |
          cd PoolAdmin
          chmod +x build.sh
          ./build.sh

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libPoolAdmin
          path: PoolAdmin/build/libPoolAdmin.dylib
